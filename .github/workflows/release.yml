name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run test:ci

      - name: Build ZIP
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist/linkedin-spider
          cp manifest.json interceptor.js lib.js content.js background.js popup.html popup.js options.html options.js options.css styles.css icon.png dist/linkedin-spider/
          cd dist && zip -r "linkedin-spider-${TAG_NAME}.zip" linkedin-spider/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            "dist/linkedin-spider-${TAG_NAME}.zip" \
            --title "LinkedIn Spider ${TAG_NAME}" \
            --generate-notes
