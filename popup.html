<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>LinkedIn Auto-Connect</h1>

    <div class="toggle-row">
      <span class="label">Auto-Connect</span>
      <label class="switch">
        <input type="checkbox" id="toggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="status" id="status">Paused</div>

    <div class="counter-row">
      <span class="counter-label">Requests sent</span>
      <span class="counter-value" id="counter">0</span>
    </div>

    <button id="reset" class="reset-btn">Reset Counter</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
