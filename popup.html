<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>LinkedIn Spider</h1>

    <div class="toggle-row">
      <span class="label">Auto-Connect</span>
      <label class="switch">
        <input type="checkbox" id="toggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="status" id="status">Paused</div>

    <div class="counter-row">
      <span class="counter-label">Requests sent</span>
      <span class="counter-value" id="counter">0</span>
    </div>

    <div class="counter-row">
      <span class="counter-label">Saved contacts</span>
      <span class="counter-value" id="logged">0</span>
    </div>

    <div class="counter-row">
      <span class="counter-label">API mode</span>
      <span class="counter-value" id="healed">default</span>
    </div>

    <button id="export" class="primary-btn" disabled>⬇ Export contacts as CSV</button>
    <p class="hint" id="hint"></p>

    <div class="btn-row">
      <button id="reset" class="reset-btn">Reset Counter</button>
      <button id="clearLog" class="reset-btn danger" disabled>Clear Log</button>
    </div>
  </div>
  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
